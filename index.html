<!DOCTYPE html>
<html>
<head>
  <title>HTML Table Basics</title>
  <style>
      table,th,td
      {
          border:5px,dotted,blue;
      }
  </style>
</head>
<body>
    <table width="50%"

      <td>987561</td>
    </tr>
    <tr>
      <td>2</td>
      <td>47</td>
      <td>Puja</td>
      <td>EE</td>
      <td>798495</td>
    </tr>
    <tr>
      <td>3</td>
      <td>63</td>
      <td>Khushi</td>
      <td>CSE</td>
      <td>710846</td>
    </tr>
  </table>

</body>
</html>
