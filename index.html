<!DOCTYPE html>
<html>
<head>
  <title>HTML Table Basics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
      text-align: center;
    }

    h2 {
      color: #004d99;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 70%;
      background-color: #ffffff;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    th, td {
      border: 2px solid #004d99;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #66b3ff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #e6f2ff;
    }

    tr:hover {
      background-color: #cce6ff;
    }
  </style>
</head>
<body>

  <h2>HTML Table Basics</h2>

  <table>
    <tr>
      <th>S. No.</th>
      <th>Roll No.</th>
      <th>Name</th>
      <th>Branch</th>
      <th>Pan No.</th>
    </tr>
    <tr>
      <td>1</td>
      <td>31</td>
      <td>Priya</td>
      <td>Mech.</td>
      <td>987561</td>
    </tr>
    <tr>
      <td>2</td>
      <td>47</td>
      <td>Puja</td>
      <td>EE</td>
      <td>798495</td>
    </tr>
    <tr>
      <td>3</td>
      <td>63</td>
      <td>Khushi</td>
      <td>CSE</td>
      <td>710846</td>
    </tr>
  </table>

</body>
</html>
