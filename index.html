<!DOCTYPE html>
<html>
<head>
  <title>HTML Table Basics</title>
  <style>
/* Stylish Table CSS */
.stylish-table {
  width: 50%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  overflow: hidden;
  background: #f9f9fc;
  font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
}

.stylish-table th, .stylish-table td {
  padding: 7px 9px;
  text-align: center;
}

.stylish-table th {
  background: linear-gradient(90deg, #6a82fb 0%, #fc5c7d 100%);
  color: #fff;
  font-size: 1.15em;
  font-weight: 600;
  border-bottom: 2px solid #eaeaea;
}

.stylish-table tbody tr {
  transition: background 0.2s;
}

.stylish-table tbody tr:nth-child(even) {
  background: #f2f7fa;
}

.stylish-table tbody tr:hover {
  background: #ffe0e6;
}

.stylish-table td {
  border-bottom: 1px solid #ececec;
  color: #333;
}

.stylish-table tr:last-child td {
  border-bottom: none;
}
</style>
</head>
  <table class="stylish-table">
    <tr>
      <th>S. No.</th>
      <th>Roll No.</th>
      <th>Name</th>
      <th>Branch</th>
      <th>Pan No.</th>
    </tr>
    <tr>
      <td>1</td>
      <td>31</td>
      <td>Priya</td>
      <td>Mech.</td>
      <td>987561</td>
    </tr>
    <tr>
      <td>2</td>
      <td>47</td>
      <td>Puja</td>
      <td>EE</td>
      <td>798495</td>
    </tr>
    <tr>
      <td>3</td>
      <td>63</td>
      <td>Khushi</td>
      <td>CSE</td>
      <td>710846</td>
    </tr>
  </table>

</body>
</html>
